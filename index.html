<style>
:root{
  --pink:#ffb6d9; --lav:#c9b6ff; --ink:#5b3b6e; --ink-soft:#8a6aa0;
  --glass:rgba(255,255,255,.55); --glass-b:rgba(255,255,255,.8);
  --shadow:0 10px 30px rgba(201,150,230,.28); --shadow-s:0 4px 14px rgba(201,150,230,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Fredoka","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(120deg,#ffd6ec,#e8d5ff,#d6e4ff,#ffd6ec);background-size:300% 300%;
  animation:bg 16s ease infinite;overflow-x:hidden;
}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid var(--glass-b);box-shadow:var(--shadow)}
/* sparkles */
#sparkles{position:fixed;inset:0;pointer-events:none;z-index:0}
.sp{position:absolute;color:#fff;opacity:.7;animation:float 8s ease-in-out infinite}
.sp svg{width:100%;height:100%;fill:currentColor;stroke:none;filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}
@keyframes float{0%,100%{transform:translateY(0) rotate(0) scale(1)}50%{transform:translateY(-26px) rotate(25deg) scale(1.2)}}
/* nav */
nav{position:sticky;top:12px;z-index:50;margin:12px auto 0;max-width:1180px;width:calc(100% - 24px);border-radius:28px;padding:10px 18px;display:flex;align-items:center;gap:14px}
.logo{font-weight:900;font-size:1.6rem;letter-spacing:.12em;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#ff7ec0,#9b7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo svg{color:#ff7ec0}
.search{flex:1;position:relative;display:flex;align-items:center}
.search>svg{position:absolute;left:14px;color:var(--ink-soft)}
.search input{width:100%;padding:11px 42px;border-radius:999px;border:1.5px solid var(--glass-b);background:rgba(255,255,255,.7);font:inherit;color:var(--ink);outline:none;transition:.2s}
.search input:focus{box-shadow:0 0 0 4px rgba(201,182,255,.5)}
.clear{position:absolute;right:10px;width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--lav);color:#fff}
.clear.show{display:flex}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 40px}
.hero{text-align:center;padding:56px 12px 26px}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:900;line-height:1.1;background:linear-gradient(90deg,#ff6fb5,#a07cff,#ff6fb5);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:bg 6s linear infinite}

.pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pill{display:flex;align-items:center;gap:7px;padding:10px 18px;border-radius:999px;font-weight:800;background:rgba(255,255,255,.6);border:1.5px solid var(--glass-b);box-shadow:var(--shadow-s);transition:.2s}

.card:hover{transform:translateY(-6px) rotate(-.6deg)}

.imgw{aspect-ratio:1;border-radius:22px;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
.imgw img{max-width:100%;max-height:100%;object-fit:contain;transition:.3s}
.card:hover .imgw img{transform:scale(1.08) rotate(3deg)}
.card h3{font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;justify-content:space-between;align-items:center;gap:6px}

.acts{display:flex;gap:8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:999px;font-weight:800;font-size:.85rem;background:rgba(255,255,255,.75);box-shadow:var(--shadow-s);transition:.2s}

.btn.dl{background:linear-gradient(135deg,#ff8cc8,#a98bff);color:#fff}
.btn.primary{background:linear-gradient(135deg,#ff8cc8,#a98bff);color:#fff;padding:13px 20px;font-size:1rem}
.btn.danger{color:#e0457b;flex:none}

.empty{grid-column:1/-1;text-align:center;padding:50px;border-radius:28px;color:var(--ink-soft);font-weight:700}
.empty svg{width:48px;height:48px;margin-bottom:10px}
footer{position:relative;z-index:1;text-align:center;padding:22px;color:var(--ink-soft);font-weight:700;display:flex;justify-content:center;align-items:center;gap:10px}
#lockBtn{opacity:.35;transition:.2s;display:flex}#lockBtn:hover{opacity:1}

.modal.open{display:flex}
.box{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:32px;padding:26px;background:rgba(255,255,255,.8);animation:pop .3s both}
.box.wide{max-width:640px}
.box h2{display:flex;align-items:center;gap:8px;font-size:1.3rem;margin-bottom:16px;justify-content:space-between}
.box h2 span{display:flex;align-items:center;gap:8px}
.box h4{margin:22px 0 10px;display:flex;align-items:center;gap:6px}
label{display:block;font-weight:800;font-size:.85rem;margin:12px 0 5px}
.field{width:100%;padding:12px 16px;border-radius:18px;border:1.5px solid #e6d8ff;background:#fff;font:inherit;color:var(--ink);outline:none}
.field:focus{box-shadow:0 0 0 4px rgba(201,182,255,.5)}
.drop{margin-top:6px;border:2.5px dashed var(--lav);border-radius:24px;padding:22px;text-align:center;color:var(--ink-soft);font-weight:700;cursor:pointer;background:rgba(255,255,255,.6);transition:.2s}
.drop.over{background:#f1e8ff;transform:scale(1.02)}
.drop img{max-height:120px;border-radius:14px;margin-top:8px}
.drop svg{width:34px;height:34px}
.msg{margin-top:10px;font-size:.88rem;font-weight:700;min-height:1.2em}
.msg.err{color:#d6336c}.msg.ok{color:#2f9e6e}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:18px;background:rgba(255,255,255,.7);margin-bottom:8px}
.row img{width:44px;height:44px;object-fit:contain;border-radius:12px;background:#fff}
.row b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:200;padding:12px 20px;border-radius:999px;font-weight:800;transition:.35s;display:flex;gap:8px;align-items:center}
.toast.show{transform:translateX(-50%)}
.hidden{display:none!important}
@media(max-width:620px){
  nav{flex-wrap:wrap;border-radius:24px}.search{order:3;flex-basis:100%}.logo{font-size:1.3rem}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:10px;border-radius:22px}.btn span{display:none}
}

html[data-theme=dark] .search input,html[data-theme=dark] .btn:not(.dl):not(.primary),html[data-theme=dark] .pill:not(.active),html[data-theme=dark] .drop,html[data-theme=dark] .row,html[data-theme=dark] .x,html[data-theme=dark] .back{background:rgba(255,255,255,.09);color:var(--ink)}
html[data-theme=dark] .imgw,html[data-theme=dark] .row img{background:rgba(255,255,255,.08)}

html.no-bfly #bfly,html.no-bfly .trail,html.no-spark #sparkles{display:none!important}.gearbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;transition:.3s}.gearbtn:hover{transform:rotate(90deg) scale(1.1)}label.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;margin:0 0 10px;border-radius:22px;background:rgba(255,255,255,.5);font-size:1rem;font-weight:600;cursor:pointer}label.set span{display:flex;align-items:center;gap:8px}label.set input{display:none}.sw{width:48px;height:28px;border-radius:99px;background:#d9ccec;position:relative;transition:.25s;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.25s}input:checked+.sw{background:linear-gradient(135deg,#ff8cc8,#a98bff)}input:checked+.sw:after{left:23px}html[data-theme=dark] label.set{background:rgba(255,255,255,.08)}</style>

    <symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></symbol>
    <symbol id="i-paw" viewBox="0 0 24 24"><circle cx="5.5" cy="11" r="2"/><circle cx="9.5" cy="6" r="2"/><circle cx="14.5" cy="6" r="2"/><circle cx="18.5" cy="11" r="2"/><path d="M12 12c-3 0-6 3-6 5.5 0 1.800 1.600 2.500 3 2.500 1.200 0 2-.5 3-.5s1.800.5 3 .5c1.400 0 3-.7 3-2.500 0-2.500-3-5.500-6-5.500z"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.500 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></symbol>

    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.900M16 3.100a4 4 0 0 1 0 7.800"/></symbol><symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.1a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.1a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.1a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/></symbol><symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.800A9 9 0 1 1 11.200 3a7 7 0 0 0 9.800 9.800z"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></symbol><symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.600 13.400l-7.200 7.200a2 2 0 0 1-2.800 0L2 12V2h10l8.600 8.600a2 2 0 0 1 0 2.800zM7 7h.01"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.500" cy="15.500" r="4.500"/><path d="M10.700 12.300L21 2M16 7l3 3"/></symbol>

  </defs>
</svg>
<div id="sparkles"></div>

<nav class="glass">
  <div class="logo"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg stroke='%23fff' stroke-width='3'%3E%3Cpath d='M50 48C30 6 2 12 8 38c3 13 28 18 42 12z' fill='%23ff9fd2'/%3E%3Cpath d='M50 52C34 58 12 62 20 82c7 12 26 2 30-26z' fill='%23d9b3ff'/%3E%3Cpath d='M50 48C70 6 98 12 92 38c-3 13-28 18-42 12z' fill='%23ff9fd2'/%3E%3Cpath d='M50 52C66 58 88 62 80 82c-7 12-26 2-30-26z' fill='%23d9b3ff'/%3E%3C/g%3E%3Cellipse cx='50' cy='52' rx='4' ry='20' fill='%238a5fb8'/%3E%3C/svg%3E" alt="" width="34" height="34" style="animation:wob 2.4s ease-in-out infinite">VEEN</div>
  <div class="search">
    <svg class="i"><use href="#i-search"/></svg>
    <input id="q" type="text" placeholder="Search stickers..." autocomplete="off" aria-label="Search stickers">
    <button class="clear" id="clr" aria-label="Clear search"><svg class="i" style="width:14px;height:14px"><use href="#i-x"/></svg></button>
  </div>
  <button class="gearbtn glass" id="gear" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
</nav>

<main>
  <section class="hero">
    <h1>VEEN Sticker World</h1>
    <p>A soft, sparkly place to collect the cutest stickers. Like your favorites and download them for free.</p>
    <div class="stats">
      <div class="stat glass"><span class="sic"><svg class="i"><use href="#i-users"/></svg></span><b id="stVisit">0</b><small>Visitors</small></div>
      <div class="stat glass"><span class="sic"><svg class="i"><use href="#i-dl"/></svg></span><b id="stDl">0</b><small>Downloads</small></div>
      <div class="stat glass"><span class="sic"><svg class="i"><use href="#i-grid"/></svg></span><b id="stCount">0</b><small>Stickers</small></div>
    </div>
    <div class="pills" id="pills"></div>
  </section>
  <section class="grid" id="grid"></section>
</main>

<footer>
  <span>Made with love, VEEN</span>
  <a id="lockBtn" href="admin.html" aria-label="Admin" style="color:inherit"><svg class="i" style="width:16px;height:16px"><use href="#i-lock"/></svg></a>
</footer>

<div class="modal" id="setModal">
  <div class="box glass">
    <h2><span><svg class="i"><use href="#i-gear"/></svg>Settings</span><button data-close aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></h2>
    <label class="set"><span><svg class="i"><use href="#i-moon"/></svg>Dark mode</span><input type="checkbox" id="sDark"><i class="sw"></i></label>
    <label class="set"><span><svg class="i"><use href="#i-sparkle"/></svg>Floating sparkles</span><input type="checkbox" id="sSpark"><i class="sw"></i></label>
    <label class="set"><span><svg class="i"><use href="#i-heart"/></svg>Butterfly</span><input type="checkbox" id="sBfly"><i class="sw"></i></label>
  </div>
</div>
<button id="top" class="glass" aria-label="Back to top"><svg class="i"><use href="#i-up"/></svg></button>
<div class="toast glass" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update, remove, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRMiavzTYf_WX2uUoAwTO3idRx8suy1VM",
  authDomain: "prompt-rovana.firebaseapp.com",
  databaseURL: "https://prompt-rovana-default-rtdb.firebaseio.com",
  projectId: "prompt-rovana",
  storageBucket: "prompt-rovana.appspot.com",
  messagingSenderId: "366548095156",
  appId: "1:366548095156:web:7f9f24875bb6909ae287e1",
  measurementId: "G-18JDFJYZ99"
};
const db = getDatabase(initializeApp(firebaseConfig));
const stickersRef = ref(db, "stickers");

const BASE_CATS = [
  { name: "All", icon: "grid" }, { name: "Love", icon: "heart" }, { name: "Cute Animals", icon: "paw" },
  { name: "Reactions", icon: "smile" }, { name: "Aesthetic", icon: "palette" }
];
let CATS = [...BASE_CATS];
const catIcon = n => (CATS.find(c => c.name === n) || {}).icon || "sparkle";

const $ = id => document.getElementById(id);
const icon = (n, s) => `<svg class="i"${s ? ` style="${s}"` : ""}><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let stickers = [], activeCat = "All", query = "";
const liked = new Set(JSON.parse(localStorage.getItem("veenLiked") || "[]"));
const viewed = new Set(JSON.parse(sessionStorage.getItem("veenViewed") || "[]"));

/* floating sparkles */
(() => {
  const box = $("sparkles");
  for (let i = 0; i < 18; i++) {
    const d = document.createElement("div"), s = 12 + Math.random() * 26;
    d.className = "sp";
    d.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-delay:${-Math.random() * 8}s;animation-duration:${6 + Math.random() * 6}s`;
    d.innerHTML = `<svg viewBox="0 0 24 24"><use href="#i-sparkle"/></svg>`;
    box.appendChild(d);
  }
})();

/* toast */
let tt;
function toast(msg, ic = "check") {
  const t = $("toast");
  t.innerHTML = icon(ic) + esc(msg);
  t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2600);
}

/* pills */
function renderPills() {
  $("pills").innerHTML = CATS.map(c =>
    `<button class="pill${c.name === activeCat ? " active" : ""}" data-cat="${c.name}">${icon(c.icon)}${c.name}</button>`).join("");
}
$("pills").addEventListener("click", e => {
  const b = e.target.closest(".pill"); if (!b) return;
  activeCat = b.dataset.cat; /* settings */
const settings = Object.assign({ dark: true, sparkles: true, butterfly: true }, JSON.parse(localStorage.getItem("veenSettings") || "{}"));
function applySettings() {
  const h = document.documentElement;
  if (settings.dark) h.dataset.theme = "dark"; else delete h.dataset.theme;
  h.classList.toggle("no-spark", !settings.sparkles);
  h.classList.toggle("no-bfly", !settings.butterfly);
  $("sDark").checked = settings.dark; $("sSpark").checked = settings.sparkles; $("sBfly").checked = settings.butterfly;
  localStorage.setItem("veenSettings", JSON.stringify(settings));
}
[["sDark", "dark"], ["sSpark", "sparkles"], ["sBfly", "butterfly"]].forEach(([id, k]) =>
  $(id).addEventListener("change", e => { settings[k] = e.target.checked; applySettings(); }));
applySettings();
const setModal = $("setModal");
$("gear").addEventListener("click", () => setModal.classList.add("open"));
setModal.addEventListener("mousedown", e => { if (e.target === setModal) setModal.classList.remove("open"); });
setModal.querySelector("[data-close]").addEventListener("click", () => setModal.classList.remove("open"));
addEventListener("keydown", e => { if (e.key === "Escape") setModal.classList.remove("open"); });
renderPills(); renderGrid();
});

/* search */
$("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  $("clr").classList.toggle("show", !!query); renderGrid();
});
$("clr").addEventListener("click", () => { $("q").value = ""; query = ""; $("clr").classList.remove("show"); renderGrid(); $("q").focus(); });

/* grid */
let loaded = false;
const isAdmin = () => sessionStorage.getItem("veenAdmin") === "1";
function renderGrid() {
  if (!loaded) return;
  const list = sorted().filter(s =>
    (activeCat === "All" || s.category === activeCat) &&
    (!query || (s.title || "").toLowerCase().includes(query) || (s.category || "").toLowerCase().includes(query)));
  if (!list.length) {
    $("grid").innerHTML = `<div class="empty glass">${icon("sparkle")}<div>No stickers found yet.</div></div>`;
    return;
  }
  $("grid").innerHTML = list.map((s, i) => `
    <article class="card glass" style="animation-delay:${Math.min(i, 12) * 40}ms" data-id="${s.id}">
      ${isAdmin() ? `<button class="del" data-act="del" aria-label="Remove sticker">${icon("trash")}</button>` : ""}
      <div class="imgw"><img src="${esc(s.url)}" alt="${esc(s.title)}" loading="lazy"></div>
      <h3 title="${esc(s.title)}">${esc(s.title)}</h3>
      <div class="meta">
        <span class="badge">${esc(s.category)}</span>
        <span class="views">${icon("eye", "width:14px;height:14px")}${s.views || 0}</span>
      </div>
      <div class="acts">
        <button class="btn like${liked.has(s.id) ? " on" : ""}" data-act="like">${icon("heart")}<span style="display:inline">${s.likes || 0}</span></button>
        <button class="btn dl" data-act="dl" aria-label="Download">${icon("dl")}<span style="display:inline">${s.downloads || 0}</span></button>
      </div>
    </article>`).join("");
  trackViews();
}

/* views: counted once per session when a card is seen */
let io;
function trackViews() {
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(en => {
    if (!en.isIntersecting) return;
    const id = en.target.dataset.id;
    io.unobserve(en.target);
    if (viewed.has(id)) return;
    viewed.add(id); sessionStorage.setItem("veenViewed", JSON.stringify([...viewed]));
    update(ref(db, "stickers/" + id), { views: increment(1) }).catch(() => {});
  }), { threshold: .6 });
  document.querySelectorAll(".card").forEach(c => io.observe(c));
}

$("grid").addEventListener("click", async e => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const id = btn.closest(".card").dataset.id, s = stickers.find(x => x.id === id);
  if (btn.dataset.act === "del") {
    if (!isAdmin() || !confirm("Remove this sticker for everyone?")) return;
    remove(ref(db, "stickers/" + id)).then(() => toast("Sticker removed", "trash")).catch(() => toast("Remove failed. Check database rules.", "alert"));
    return;
  }
  if (btn.dataset.act === "like") {
    const on = !liked.has(id);
    on ? liked.add(id) : liked.delete(id);
    localStorage.setItem("veenLiked", JSON.stringify([...liked]));
    update(ref(db, "stickers/" + id), { likes: increment(on ? 1 : -1) }).catch(() => toast("Could not update like", "alert"));
    if (on) { const r = btn.getBoundingClientRect(); burst(r.left / innerWidth + r.width / innerWidth / 2, r.top / innerHeight, .4); }
  } else if (s) {
    btn.disabled = true;
    burst(.5, .6, 1);
    update(ref(db, "stickers/" + id), { downloads: increment(1) }).catch(() => {});
    await download(s);
    btn.disabled = false;
  }
});

/* confetti with hearts and sparkles */
function burst(x, y, k) {
  if (typeof confetti !== "function") return;
  const shapes = [confetti.shapeFromPath({ path: "M167 72c19-38 64-16 64 18 0 40-64 90-64 90s-64-50-64-90c0-34 45-56 64-18z" })];
  const colors = ["#ff8cc8", "#c9b6ff", "#ffd0e8", "#ffffff", "#a98bff"];
  confetti({ particleCount: Math.round(70 * k), spread: 90, origin: { x, y }, colors, shapes, scalar: 2.2, ticks: 220 });
  confetti({ particleCount: Math.round(50 * k), spread: 120, origin: { x, y }, colors, shapes: ["star", "circle"], scalar: 1.1 });
}

async function download(s) {
  const base = (s.title || "sticker").replace(/[^\w\-]+/g, "_");
  try {
    const blob = await (await fetch(s.url)).blob();
    const ext = (blob.type.split("/")[1] || "png").split("+")[0];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `${base}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast("Download started");
  } catch {
    const a = document.createElement("a");
    a.href = s.url; a.download = base; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    toast("Opened image in new tab", "image");
  }
}

/* stats: visitors (once per session) and total downloads */
function countTo(id, n) {
  const el = $(id), from = +el.dataset.v || 0; el.dataset.v = n;
  const t0 = performance.now();
  (function step(t) {
    const p = Math.min(1, (t - t0) / 700);
    el.textContent = Math.round(from + (n - from) * p).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function updateStats() {
  countTo("stDl", stickers.reduce((a, s) => a + (s.downloads || 0), 0));
  countTo("stCount", stickers.length);
}
if (!sessionStorage.getItem("veenVisited")) {
  sessionStorage.setItem("veenVisited", "1");
  update(ref(db, "stats"), { visits: increment(1) }).catch(() => {});
}
onValue(ref(db, "stats/visits"), s => countTo("stVisit", s.val() || 0));
/* sorting, result count, skeletons, image fallback, back to top */
let sortBy = "new";
const sorted = () => {
  const f = { new: s => s.createdAt || 0, liked: s => s.likes || 0, dl: s => s.downloads || 0, view: s => s.views || 0 }[sortBy];
  return [...stickers].sort((a, b) => f(b) - f(a));
};

$("grid").innerHTML = Array(8).fill('<div class="skel"></div>').join("");
$("grid").addEventListener("error", e => {
  const im = e.target;
  if (im.tagName !== "IMG" || im.dataset.err) return;
  im.dataset.err = 1;
  im.src = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#c9b6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>');
}, true);
addEventListener("scroll", () => $("top").classList.toggle("show", scrollY > 450), { passive: true });
$("top").addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
/* custom categories added by admin (Firebase /categories) */
onValue(ref(db, "categories"), snap => {
  const names = [...new Set(Object.values(snap.val() || {}).map(n => String(n).trim()).filter(Boolean))]
    .filter(n => !BASE_CATS.some(b => b.name.toLowerCase() === n.toLowerCase()));
  CATS = [...BASE_CATS, ...names.map(name => ({ name, icon: "tag" }))];
  if (!CATS.some(c => c.name === activeCat)) activeCat = "All";
  renderPills(); renderGrid();
});
/* realtime sync */
onValue(stickersRef, snap => {
  const v = snap.val() || {};
  stickers = Object.entries(v).map(([id, d]) => ({ id, ...d })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  loaded = true; renderGrid(); updateStats();
}, err => { $("grid").innerHTML = `<div class="empty glass">${icon("alert")}<div>Could not connect to the database.</div></div>`; console.error(err); });

addEventListener("keydown", e => { if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "a") { e.preventDefault(); location.href = "admin.html"; } });
/* settings */
const settings = Object.assign({ dark: true, sparkles: true, butterfly: true }, JSON.parse(localStorage.getItem("veenSettings") || "{}"));
function applySettings() {
  const h = document.documentElement;
  if (settings.dark) h.dataset.theme = "dark"; else delete h.dataset.theme;
  h.classList.toggle("no-spark", !settings.sparkles);
  h.classList.toggle("no-bfly", !settings.butterfly);
  $("sDark").checked = settings.dark; $("sSpark").checked = settings.sparkles; $("sBfly").checked = settings.butterfly;
  localStorage.setItem("veenSettings", JSON.stringify(settings));
}
[["sDark", "dark"], ["sSpark", "sparkles"], ["sBfly", "butterfly"]].forEach(([id, k]) =>
  $(id).addEventListener("change", e => { settings[k] = e.target.checked; applySettings(); }));
applySettings();
const setModal = $("setModal");
$("gear").addEventListener("click", () => setModal.classList.add("open"));
setModal.addEventListener("mousedown", e => { if (e.target === setModal) setModal.classList.remove("open"); });
setModal.querySelector("[data-close]").addEventListener("click", () => setModal.classList.remove("open"));
addEventListener("keydown", e => { if (e.key === "Escape") setModal.classList.remove("open"); });

<script>
(() => {
  const el = document.getElementById("bfly"), S = 78;
  let x = -120, y = innerHeight * .4, vx = 2, vy = 0, tx = innerWidth * .5, ty = innerHeight * .3, t = 0, last = 0;
  const pick = () => { tx = 60 + Math.random() * (innerWidth - 120); ty = 60 + Math.random() * (innerHeight - 140); };
  let boostUntil = 0;
  addEventListener("pointerdown", e => {
    if (e.target.closest("input,select,textarea")) return;
    const cx = x + S / 2, cy = y + S / 2, dd = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (dd < 110) {
      const a = Math.atan2(cy - e.clientY, cx - e.clientX);
      vx = Math.cos(a) * 9; vy = Math.sin(a) * 9; boostUntil = performance.now() + 1500;
      tx = Math.min(innerWidth - 60, Math.max(60, cx + Math.cos(a) * 450));
      ty = Math.min(innerHeight - 80, Math.max(60, cy + Math.sin(a) * 450));
    } else { tx = e.clientX; ty = e.clientY; }
  });
  function heart() {
    const h = document.createElement("div"); h.className = "trail";

  }
